<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台灣普熙技術服務部 系統入口</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1d2733;--sub:#5f6b7a;--line:#d9dee6;--hd:#1f2d3d;--hd2:#2b3d52;--acc:#1f6feb;--accS:#e7f0ff;--ok:#1f9d55;--bad:#d93a3a;--warn:#e08a12;
--c-report:#1565C0;--c-teardown:#6A1B9A;--c-fs:#2E7D32;--c-cq:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--hd);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;letter-spacing:.5px;display:flex;align-items:baseline;gap:8px}
header h1 small{font-size:13px;font-weight:400;opacity:.75}
header .logo{height:44px;width:auto;display:block;border-radius:4px}
header .ver{font-size:11px;opacity:.55}
.bar{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rstat{font-size:12px;opacity:.9;margin-right:4px}
.rstat.warn{color:#ffcf7a}
nav{background:var(--hd2);display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav button{background:none;border:0;color:#c9d4e2;padding:10px 16px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#4da3ff;font-weight:700}
main{padding:16px;max-width:1280px;margin:0 auto}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled],.btn.dis{opacity:.45;pointer-events:none}
header .btn{background:#34475e;border-color:#47607d;color:#fff}
header .btn.pri{background:var(--acc);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.hint{font-size:12px;color:var(--sub)}
.banner{background:#fff8e6;border:1px solid #f3d38b;color:#7a5200;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--accS);border-color:#b9d3ff;color:#1b4a9a}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.tile{background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tile .tt{display:flex;align-items:baseline;gap:8px}
.tile .tt b{font-size:17px}
.tile .tt span{font-size:12px;color:var(--sub)}
.tile .desc{font-size:12.5px;color:var(--sub);min-height:34px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st{background:#f6f8fb;border-radius:6px;padding:6px 8px}
.st .v{font-size:20px;font-weight:700}
.st .l{font-size:11px;color:var(--sub)}
.st.alert .v{color:var(--bad)}
.tile .foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.tile .foot .hint{margin-right:auto}
.msg{font-size:12px;color:var(--sub);background:#f6f8fb;border-radius:6px;padding:8px}
.msg.err{color:var(--bad);background:#fdf0f0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld>span{font-size:12px;color:var(--sub)}
input[type=text],input[type=password],textarea,select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;background:#fff;color:var(--ink)}
textarea{resize:vertical}
code{font-family:Consolas,monospace;background:#f1f3f6;padding:1px 4px;border-radius:4px;font-size:12px}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:#f6f8fb;font-weight:600;font-size:12px;color:var(--sub)}
.okc{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}.wrnc{color:var(--warn);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#f1f3f6;border-radius:12px;padding:2px 10px;font-size:12px}
.chip.new{background:#e3f6ea;color:#17703c}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2d3d;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:99;max-width:90vw}
.toast.err{background:#a32d2d}
.lock{max-width:360px;margin:30px auto;text-align:center}
</style>
</head>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const ym=()=>today().slice(0,7);
const toTs=x=>typeof x==='number'?x:(Date.parse(x||'')||0);
const fDT=t=>{if(!t)return '—';const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
function toast(m,err){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),err?5000:2600)}
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const idb={db:null,
  async open(){if(this.db)return this.db;this.db=await new Promise((res,rej)=>{const r=indexedDB.open('svc_portal',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return this.db},
  async get(k){try{const db=await this.open();return await new Promise(r=>{const q=db.transaction('h').objectStore('h').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}},
  async set(k,v){try{const db=await this.open();return await new Promise(r=>{const t=db.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)})}catch(e){return false}}};

/* 報工共用檔可能是壓縮格式（SR0/SR1） */
function b64uDec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function parseAny(t){
  t=String(t||'').replace(/^\uFEFF/,'').trim();if(!t)return null;
  if(t.startsWith('SR0:'))return JSON.parse(new TextDecoder().decode(b64uDec(t.slice(4))));
  if(t.startsWith('SR1:')){const s=new Blob([b64uDec(t.slice(4))]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(s).text())}
  return JSON.parse(t);
}

/* ---------- 狀態 ---------- */
const S={tab:'home',root:null,perm:'none',each:{},needGrant:[],dirs:{},data:{},info:{},errs:{},set:null,setLoadedAt:'',setExists:false,unlocked:false,loading:false,check:null};

/* ---------- 來源 ---------- */
const ready=()=>MODE()==='each'?Object.keys(S.each).length>0:(!!S.root&&S.perm==='granted');
async function clearEach(){for(const k of EACH_KEYS)await idb.set('each_'+k,null);S.each={};S.needGrant=[]}
async function pickEach(k){
  if(!FSA){toast('請用電腦版 Chrome 或 Edge 開啟',true);return}
  try{const h=await showDirectoryPicker({id:'svc-each-'+k,mode:'read'});
    if(MODE()!=='each'){localStorage.setItem('svc_portal_mode','each');S.root=null;S.perm='none';await idb.set('root',null)}
    S.each[k]=h;S.needGrant=S.needGrant.filter(x=>x!==k);await idb.set('each_'+k,h);await loadAll()}
  catch(e){if(e.name!=='AbortError')toast('指定失敗：'+e.message,true)}
}
function startEach(){localStorage.setItem('svc_portal_mode','each');S.tab='home';render()}
async function grantEach(){
  for(const k of [...S.needGrant]){try{if(await S.each[k].requestPermission({mode:'read'})==='granted')S.needGrant=S.needGrant.filter(x=>x!==k)}catch(e){break}}
  if(S.needGrant.length)toast('還有 '+S.needGrant.length+' 個資料夾未授權，請再按一次「授權讀取」',true);
  await loadAll();
}
/* ---------- 根目錄 ---------- */
const FSA='showDirectoryPicker' in window;
async function linkRoot(){
  if(!FSA){toast('請用電腦版 Chrome 或 Edge 開啟',true);return}
  try{const h=await showDirectoryPicker({id:'svc-portal-root',mode:'read'});S.root=h;S.perm='granted';await idb.set('root',h);
    if(MODE()==='each'){localStorage.removeItem('svc_portal_mode');await clearEach();toast('已切換到 NAS 根目錄模式')}
    await loadAll()}
  catch(e){if(e.name!=='AbortError')toast('連結失敗：'+e.message,true)}
}
async function restoreRoot(){
  if(MODE()==='each'){
    for(const k of EACH_KEYS){const h=await idb.get('each_'+k);if(h)S.each[k]=h}
    for(const k in S.each){let p='prompt';try{p=await S.each[k].queryPermission({mode:'read'})}catch(e){}if(p!=='granted')S.needGrant.push(k)}
    if(Object.keys(S.each).length)await loadAll();else render();return}
  const h=await idb.get('root');if(!h)return;S.root=h;
  try{S.perm=await h.queryPermission({mode:'read'})}catch(e){S.perm='prompt'}
  if(S.perm==='granted')await loadAll();else render();
}
async function grantRoot(){
  if(!S.root)return linkRoot();
  try{S.perm=await S.root.requestPermission({mode:'read'})}catch(e){S.perm='denied'}
  if(S.perm==='granted')await loadAll();else{toast('未取得讀取權限',true);render()}
}

/* 對應子資料夾：共用設定指定 > 名稱比對 */
async function mapDirs(){
  const dirs=[];for await(const [n,h] of S.root.entries())if(h.kind==='directory'&&!n.startsWith('.')&&!n.startsWith('#'))dirs.push([n,h]);
  const fixed=(S.set&&S.set.folders)||{};const out={};const used=new Set();
  for(const s of [...AUX,...SYS]){const want=fixed[s.k];const hit=want?dirs.find(([n])=>n===want):null;if(hit){out[s.k]=hit;used.add(hit[0])}}
  for(const s of [...AUX,...SYS]){if(out[s.k])continue;const hit=dirs.find(([n])=>!used.has(n)&&s.match.test(n));if(hit){out[s.k]=hit;used.add(hit[0])}}
  S.allDirs=dirs.map(d=>d[0]).sort();
  S.dirs={};for(const k in out)S.dirs[k]={name:out[k][0],h:out[k][1]};
  const cache={};for(const k in S.dirs)cache[k]=S.dirs[k].name;ls.set('svc_portal_dirs',cache);
}
async function findFile(dir,test,depth,prefer){
  const files=[],subs=[];
  for await(const [n,h] of dir.entries()){if(h.kind==='file'&&/\.json$/i.test(n)&&!/^push_/i.test(n))files.push([n,h]);else if(h.kind==='directory'&&depth>0&&!/^(photos?|files|回報|\.|#)/i.test(n))subs.push(h)}
  files.sort((a,b)=>(b[0]===prefer)-(a[0]===prefer));
  for(const [n,h] of files){try{const f=await h.getFile();if(f.size>60e6)continue;const d=await parseAny(await f.text());if(test(d,n))return {name:n,data:d,mod:f.lastModified}}catch(e){}}
  for(const s of subs){const r=await findFile(s,test,depth-1,prefer);if(r){r.name=s.name+'/'+r.name;return r}}
  return null;
}
async function hasIndex(dir){try{await dir.getFileHandle('index.html');return true}catch(e){return false}}

/* ---------- 讀取 ---------- */
async function loadSettings(){
  S.set=null;S.setExists=false;
  const d=S.dirs.settings;if(!d){S.set=DEF_SET();return}
  try{const fh=await d.h.getFileHandle(SETFILE);const t=await (await fh.getFile()).text();const j=await parseAny(t);
    if(j&&j.app==='shared-settings'){S.set=normSet(j);S.setExists=true;S.setLoadedAt=S.set.updatedAt;return}}catch(e){}
  S.set=DEF_SET();
}
function normSet(j){const d=DEF_SET();j=Object.assign(d,j);j.formats=Object.assign(DEF_SET().formats,j.formats||{});
  for(const k of ['wo','fsn'])j.formats[k]=Object.assign({example:'',pattern:'',note:''},j.formats[k]||{});
  if(!Array.isArray(j.families))j.families=[...DEF_FAMILIES];j.folders=j.folders||{};j.links=j.links||{};return j}

async function loadAll(){
  if(S.loading||!ready())return;S.loading=true;setStat('讀取中…');
  S.data={};S.info={};S.errs={};
  try{
    if(MODE()==='each'){S.dirs={};for(const k in S.each)if(!S.needGrant.includes(k))S.dirs[k]={name:S.each[k].name,h:S.each[k]};await loadSettings()}
    else{await mapDirs();await loadSettings();
    if(S.set&&Object.keys(S.set.folders||{}).length)await mapDirs();} // 共用設定有指定資料夾時重新對應
    const jobs={
      report:async d=>findFile(d,x=>x&&x.app==='service-report'&&Array.isArray(x.records),2,'報工_shared.json'),
      cq:async d=>findFile(d,x=>x&&x.app==='CQ'&&Array.isArray(x.cases),1,'客戶問題點資料.json'),
      fs:async d=>findFile(d,(x,n)=>n==='fs_schedule.json'||(x&&x.cases&&x.settings&&typeof x.cases==='object'&&!Array.isArray(x.cases)),2,'fs_schedule.json'),
      teardown:async d=>{let n=0;for await(const [nm,h] of d.entries())if(h.kind==='directory'&&!/^[.#]/.test(nm))n++;return {name:'(資料夾)',data:{folders:n},mod:0}}
    };
    await Promise.all(SYS.map(async s=>{const d=S.dirs[s.k];if(!d)return;
      try{S.info[s.k]={index:await hasIndex(d.h)};const r=await jobs[s.k](d.h);if(r)S.data[s.k]=r;else S.errs[s.k]='找不到資料檔'}
      catch(e){S.errs[s.k]=e.name==='NotAllowedError'?'沒有讀取權限':('讀取失敗：'+e.message)}}));
    S.loadedAt=Date.now();setStat();
  }catch(e){setStat('讀取失敗',true);toast('讀取失敗：'+e.message,true)}
  S.loading=false;S.check=null;render();
}
function setStat(t,warn){const el=$('#rstat');
  if(t){el.textContent=t;el.className='rstat'+(warn?' warn':'');return}
  if(MODE()==='each'){const n=Object.keys(S.each).length;el.textContent='過渡模式：個別指定資料夾 '+n+' 個'+(S.needGrant.length?'（'+S.needGrant.length+' 個待授權）':'')+(S.loadedAt?'　讀取於 '+fDT(S.loadedAt):'');el.className='rstat'+(S.needGrant.length||!n?' warn':'');return}
  if(!S.root){el.textContent='尚未連結共用資料夾';el.className='rstat warn';return}
  if(S.perm!=='granted'){el.textContent='「'+S.root.name+'」需要重新授權';el.className='rstat warn';return}
  el.textContent='共用根目錄：'+S.root.name+(S.loadedAt?'　讀取於 '+fDT(S.loadedAt):'');el.className='rstat'}

/* ---------- 摘要 ---------- */
function summarize(k){
  const r=S.data[k];if(!r)return null;const d=r.data,m=ym(),t=today();
  if(k==='report'){const live=d.records.filter(x=>!x.deleted);const mon=live.filter(x=>String(x.date||'').startsWith(m));
    const wos=new Set(mon.map(x=>String(x.wo||'').trim()).filter(Boolean));
    const last=Math.max(0,...live.map(x=>toTs(x.updatedAt)||toTs(x.createdAt)));
    return {stats:[['本月報工',mon.length],['今日報工',live.filter(x=>x.date===t).length],['本月工單數',wos.size]],last:last||r.mod}}
  if(k==='cq'){const cs=d.cases||[];const open=cs.filter(c=>!['closed','cancel'].includes(c.status));
    return {stats:[['未結案',open.length],['A 級未結',open.filter(c=>c.severity==='A').length,open.some(c=>c.severity==='A')],['本月新增',cs.filter(c=>String(c.receivedAt||'').startsWith(m)).length]],last:toTs(d.updatedAt)||r.mod}}
  if(k==='fs'){const cs=Object.values(d.cases||{});const cnt=st=>cs.filter(c=>(c.stage||'待安排')===st).length;
    const mon=new Date();mon.setDate(mon.getDate()-((mon.getDay()+6)%7));const ws=ymd(mon);mon.setDate(mon.getDate()+6);const we=ymd(mon);
    const wk=cs.filter(c=>c.date&&c.date>=ws&&c.date<=we&&!['取消'].includes(c.stage)).length;
    const last=Math.max(0,...cs.map(c=>toTs(c.updatedAt)));
    return {stats:[['已排程',cnt('已排程')],['本週排程',wk],['完成待報告',cnt('已完成待報告'),cnt('已完成待報告')>0]],last:last||r.mod,note:'待安排件數在業務 Excel，入口不讀取'}}
  if(k==='teardown')return {stats:[['子資料夾',d.folders]],last:0,note:'系統建置中'};
}

/* ---------- 共用設定 ---------- */
async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('svc-portal:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of 'svc-portal:'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'djb'+(h>>>0).toString(16)}
}
function exampleToPattern(ex){
  ex=String(ex||'').trim();if(!ex)return '';
  return '^'+ex.replace(/\d+|[^\d]/g,m=>/^\d+$/.test(m)?'\\d{'+m.length+'}':m.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'))+'$';
}
function testPat(p,v){if(!p)return null;try{return new RegExp(p,'i').test(String(v).trim())}catch(e){return undefined}}
function sampleValues(kind){
  const out=[];
  if(kind==='wo'){const r=S.data.report;if(r)r.data.records.filter(x=>!x.deleted&&x.wo).forEach(x=>out.push(['報工',String(x.wo).trim()]));
    const c=S.data.cq;if(c)(c.data.cases||[]).filter(x=>x.woNo).forEach(x=>out.push(['客訴',String(x.woNo).trim()]))}
  else{const f=S.data.fs;if(f)Object.keys(f.data.cases||{}).forEach(k=>out.push(['Field Service',k]))}
  const seen=new Set();return out.filter(([s,v])=>{const key=s+'|'+v;if(seen.has(key))return false;seen.add(key);return true});
}
function fmtBlock(kind,label){
  const f=S.set.formats[kind],sv=sampleValues(kind);const p=f.pattern;
  let stat='';
  if(sv.length){if(!p)stat=`現有資料 ${sv.length} 筆，尚未設定格式所以不檢查。`;
    else{const bad=sv.filter(([,v])=>testPat(p,v)===false);const okN=sv.length-bad.length;
      stat=`現有資料 ${sv.length} 筆：<span class="okc">${okN} 筆符合</span>${bad.length?`、<span class="badc">${bad.length} 筆不符</span>`:''}`+
      (bad.length?`<div class="chips" style="margin-top:6px">${bad.slice(0,30).map(([s,v])=>`<span class="chip" title="${esc(s)}">${esc(v)}</span>`).join('')}${bad.length>30?`<span class="hint">…另 ${bad.length-30} 筆</span>`:''}</div>`:'')}}
  else stat='目前讀不到現有資料可供比對。';
  const valid=p?testPat(p,'x')!==undefined:true;
  return `<div class="card"><h3>${label}</h3>
    <label class="fld"><span>範例（填一個標準寫法）</span><input type="text" data-f="${kind}.example" value="${esc(f.example)}" placeholder="${kind==='wo'?'例如 WO2026-00123':'例如 FS2026A12-1'}"></label>
    <div class="row" style="margin-bottom:10px"><button class="btn sm" data-act="genpat" data-k="${kind}">依範例產生檢查規則</button><span class="hint">數字會變成「同樣位數的數字」，其他字照抄。</span></div>
    <label class="fld"><span>檢查規則（正規表示式，留白＝不檢查）${valid?'':' <span class="badc">規則寫法有誤</span>'}</span><input type="text" data-f="${kind}.pattern" value="${esc(p)}" style="font-family:Consolas,monospace"></label>
    <label class="fld"><span>說明（各系統輸入錯誤時顯示）</span><input type="text" data-f="${kind}.note" value="${esc(f.note)}" placeholder="${kind==='wo'?'例如：WO 開頭＋4 碼年份＋「-」＋5 碼流水號':'例如：FS＋年份＋業務代碼＋序號－分段'}"></label>
    <label class="fld"><span>試試看</span><input type="text" data-try="${kind}" placeholder="輸入一個號碼測試"><span class="hint" id="try-${kind}"></span></label>
    <div class="msg">${stat}</div></div>`;
}
function vSettings(){
  if(!ready())return banner()+`<div class="card">共用設定存放在 NAS 的「共用設定」資料夾，請先連結共用根目錄。</div>`;
  if(MODE()==='each'&&!S.dirs.settings)return banner()+`<div class="card">請先指定共用設定資料夾。</div>`;
  if(!S.dirs.settings)return `<div class="banner">在根目錄找不到「共用設定」資料夾。目前根目錄下的資料夾：${(S.allDirs||[]).map(esc).join('、')||'（無）'}</div>`;
  if(!S.unlocked){const first=!S.set.adminHash;
    return `<div class="card lock"><h3>${first?'設定管理密碼':'管理者解鎖'}</h3>
      <p class="hint">${first?'第一次使用，請設定管理密碼（只有管理者能修改共用設定）。':'共用設定會影響所有系統，需要管理密碼。'}</p>
      <input type="password" id="pw1" placeholder="管理密碼" style="margin-bottom:8px">${first?'<input type="password" id="pw2" placeholder="再輸入一次" style="margin-bottom:8px">':''}
      <button class="btn pri" data-act="${first?'setpw':'unlock'}">${first?'設定並進入':'解鎖'}</button></div>`}
  const st=S.set,fam=st.families;
  const others=familySources();
  const folderRows=[...AUX,...SYS].map(s=>`<tr><td>${s.code} ${esc(s.name)}</td><td><select data-folder="${s.k}"><option value="">（自動比對）</option>${(S.allDirs||[]).map(n=>`<option ${st.folders[s.k]===n?'selected':''}>${esc(n)}</option>`).join('')}</select></td><td class="hint">${S.dirs[s.k]?'目前：'+esc(S.dirs[s.k].name):'<span class="wrnc">未找到</span>'}</td></tr>`).join('');
  return `${S.setExists?'':'<div class="banner">共用設定檔還沒建立，下面是預設值；按「儲存」後會在共用設定資料夾建立「'+SETFILE+'」。</div>'}
  <p class="hint" style="margin:0 0 8px">共用設定檔位置：「${esc(S.dirs.settings.name)}」資料夾的 ${SETFILE}${MODE()==='each'?'（過渡位置，NAS 上線後請搬移到 NAS 共用設定資料夾）':'（NAS）'}</p>
  <div class="row" style="margin-bottom:14px"><button class="btn ok" data-act="save">儲存共用設定</button><button class="btn" data-act="reload">放棄修改</button><button class="btn" data-act="lock">上鎖</button>
   <span class="hint">${st.updatedAt?'上次儲存：'+fDT(st.updatedAt)+(st.updatedBy?'（'+esc(st.updatedBy)+'）':''):''}</span><span class="hint" id="dirty"></span></div>
  <div class="grid2">
   <div class="card"><h3>機種家族（${fam.length}）</h3>
    <label class="fld"><span>一行一個，順序就是各系統點選時的順序</span><textarea id="fam" rows="12">${esc(fam.join('\n'))}</textarea></label>
    ${others.map(o=>{const add=o.list.filter(x=>!fam.includes(x));return `<div class="row" style="margin-bottom:6px"><span class="hint">${esc(o.src)} 有 ${o.list.length} 個${add.length?'，其中 '+add.length+' 個不在清單：':'，都已在清單中'}</span>${add.length?`<span class="chips">${add.map(x=>`<span class="chip new">${esc(x)}</span>`).join('')}</span><button class="btn sm" data-act="famadd" data-src="${esc(o.src)}">加入</button>`:''}</div>`}).join('')}
    <p class="hint">客戶問題點的「從報工 JSON 匯入機種」可以直接選這個共用設定檔匯入。其他系統改成自動讀取共用設定，會在下一步調整。</p></div>
   <div>${fmtBlock('wo','WO 工單號格式')}${fmtBlock('fsn','FSN 格式')}</div>
  </div>
  ${MODE()==='each'?`<div class="card"><h3>過渡期網址</h3><p class="hint">NAS 上線前，首頁「開啟」按鈕連到這些網址（各系統的 GitHub Pages）。NAS 上線後改用 NAS 上的檔案，這裡就不再使用。</p>
   <table class="tbl"><tbody>${SYS.map(s=>`<tr><td style="width:160px">${s.code} ${esc(s.name)}</td><td><input type="text" data-link="${s.k}" value="${esc((st.links||{})[s.k]??DEF_LINKS[s.k]??'')}" placeholder="https://…（留白＝沒有開啟按鈕）"></td></tr>`).join('')}</tbody></table></div>`:''}
  <div class="card" style="${MODE()==='each'?'display:none':''}"><h3>資料夾對應</h3><p class="hint">IT 開的資料夾名稱和預設比對不同時，在這裡指定。指定後所有電腦都會照這個對應。</p>
   <table class="tbl"><thead><tr><th>系統</th><th>NAS 資料夾</th><th></th></tr></thead><tbody>${folderRows}</tbody></table></div>
  <div class="card"><h3>管理密碼</h3><div class="row"><input type="password" id="npw1" placeholder="新密碼" style="max-width:200px"><input type="password" id="npw2" placeholder="再輸入一次" style="max-width:200px"><button class="btn sm" data-act="chpw">變更（儲存後生效）</button></div>
   <p class="hint">密碼只能防止誤改，真正的保護是 NAS 帳號權限：共用設定資料夾只有管理者帳號能寫入。</p></div>`;
}
function familySources(){
  const o=[];const r=S.data.report;if(r&&r.data.master&&Array.isArray(r.data.master.models))o.push({src:'報工',list:r.data.master.models.map(String)});
  const c=S.data.cq;if(c&&c.data.master&&Array.isArray(c.data.master.families))o.push({src:'客訴',list:c.data.master.families.map(String)});
  return o;
}
function readForm(){
  const st=S.set;const fa=$('#fam');if(fa)st.families=[...new Set(fa.value.split('\n').map(x=>x.trim()).filter(Boolean))];
  document.querySelectorAll('[data-f]').forEach(el=>{const [k,f]=el.dataset.f.split('.');st.formats[k][f]=el.value.trim()});
  document.querySelectorAll('[data-link]').forEach(el=>{st.links=st.links||{};st.links[el.dataset.link]=el.value.trim()});
  document.querySelectorAll('[data-folder]').forEach(el=>{if(el.value)st.folders[el.dataset.folder]=el.value;else delete st.folders[el.dataset.folder]});
}
async function saveSet(){
  readForm();const d=S.dirs.settings;if(!d){toast('找不到共用設定資料夾',true);return}
  for(const k of ['wo','fsn'])if(S.set.formats[k].pattern&&testPat(S.set.formats[k].pattern,'x')===undefined){toast((k==='wo'?'WO':'FSN')+' 檢查規則寫法有誤',true);return}
  try{
    let p=await d.h.queryPermission({mode:'readwrite'});if(p!=='granted')p=await d.h.requestPermission({mode:'readwrite'});
    if(p!=='granted'){toast('沒有寫入權限（這台電腦的帳號可能是唯讀）',true);return}
    let cur=null;try{cur=await parseAny(await (await (await d.h.getFileHandle(SETFILE)).getFile()).text())}catch(e){}
    if(cur&&cur.updatedAt&&toTs(cur.updatedAt)>toTs(S.setLoadedAt)&&!confirm(`共用設定在 ${fDT(cur.updatedAt)} 被其他電腦改過。\n仍要用目前畫面上的內容覆蓋嗎？`))return;
    const me=(ls.get('svc_portal_me')||prompt('儲存者名稱（記錄用）','Coos')||'').trim();if(me)ls.set('svc_portal_me',me);
    const out={...S.set,app:'shared-settings',ver:1,updatedAt:new Date().toISOString(),updatedBy:me};
    const fh=await d.h.getFileHandle(SETFILE,{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(out,null,1));await w.close();
    S.set=out;S.setExists=true;S.setLoadedAt=out.updatedAt;S.dirty=false;toast('共用設定已儲存');await loadAll();
  }catch(e){toast('儲存失敗：'+e.message,true)}
}

/* ---------- 部署檢查 ---------- */
async function scanExternal(dir){
  try{const t=await (await (await dir.getFileHandle('index.html')).getFile()).text();
    const ext=[...t.matchAll(/<(?:script|link)[^>]+(?:src|href)\s*=\s*["'](https?:\/\/[^"']+)["']/gi)].map(m=>m[1]);
    const fetches=[...t.matchAll(/fetch\(\s*["'](https?:\/\/[^"']+)/gi)].map(m=>m[1]);
    return {ok:true,ext:[...new Set([...ext,...fetches])]}}catch(e){return {ok:false,ext:[]}}
}
async function runCheck(){
  S.check={rows:null};const rows=[];
  rows.push(['瀏覽器支援資料夾存取',FSA?'ok':'bad',FSA?'可以':'請改用電腦版 Chrome 或 Edge']);
  if(MODE()==='each')rows.push(['連結方式','warn','過渡模式：個別指定資料夾（NAS 上線後請切換到根目錄）']);
  else rows.push(['共用根目錄',S.root?'ok':'bad',S.root?S.root.name:'未連結']);
  rows.push(['共用設定檔',S.setExists?'ok':'warn',S.setExists?SETFILE:'尚未建立（到「共用設定」儲存一次）']);
  for(const s of [...AUX,...SYS]){const d=S.dirs[s.k];
    if(MODE()==='each'&&s.k==='portal')continue;
    if(!d){rows.push([s.code+' '+s.name,'bad','找不到資料夾']);continue}
    if(s.k==='settings'){rows.push([s.code+' '+s.name,'ok',d.name]);continue}
    const sc=await scanExternal(d.h);
    let lv='ok',msg=d.name;
    if(!sc.ok){lv=s.k==='portal'||MODE()==='each'?'warn':'bad';msg+=MODE()==='each'?'：資料夾內沒有 index.html（過渡期從 GitHub Pages 開啟，不影響）':'：沒有 index.html'}
    else if(sc.ext.length){lv='warn';msg+='：網頁會連外部網址，報工電腦和拆解／組裝電腦斷網時會失效 → '+sc.ext.map(u=>'<code>'+esc(u.replace(/^https?:\/\//,'').slice(0,60))+'</code>').join(' ')}
    if(SYS.some(x=>x.k===s.k)&&sc.ok){const df=S.data[s.k];msg+=df?'；資料：'+esc(df.name):(s.k==='teardown'?'':'；<span class="badc">找不到資料檔</span>')}
    rows.push([s.code+' '+s.name,lv,msg]);
  }
  S.check.rows=rows;if(S.tab==='check')render();
}
function vCheck(){
  if(!ready())return banner()+`<div class="card">連結共用根目錄（或個別指定資料夾）後才能檢查。</div>`;
  if(!S.check||!S.check.rows)return `<div class="card">檢查中…</div>`;
  const ic={ok:'<span class="okc">✔</span>',warn:'<span class="wrnc">!</span>',bad:'<span class="badc">✖</span>'};
  return `<div class="card"><h3>部署檢查</h3><table class="tbl"><thead><tr><th style="width:28px"></th><th style="width:180px">項目</th><th>結果</th></tr></thead><tbody>
   ${S.check.rows.map(([a,l,m])=>`<tr><td>${ic[l]}</td><td>${esc(a)}</td><td>${l==='ok'||m.includes('<')?m:esc(m)}</td></tr>`).join('')}</tbody></table>
   <div class="row" style="margin-top:10px"><button class="btn sm" data-act="recheck">重新檢查</button><span class="hint">每台電腦第一次使用時跑一次，確認資料夾、網頁和資料檔都找得到。</span></div></div>`;
}

/* ---------- 事件 ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-act],#bRoot,#bRefresh');if(!t)return;
  if(t.id==='bRoot'){if(MODE()==='each'&&!confirm('切換到 NAS 根目錄模式？\n個別指定的資料夾會清除；共用設定.json 請先搬移到 NAS 的共用設定資料夾。'))return;return MODE()!=='each'&&S.root&&S.perm!=='granted'?grantRoot():linkRoot()}
  if(t.id==='bRefresh'){if(MODE()==='each'){if(S.needGrant.length)await grantEach();else await loadAll()}else if(S.root&&S.perm==='granted')await loadAll();else if(S.root)await grantRoot();return}
  if(t.dataset.tab){if(S.tab==='settings'&&S.unlocked)readForm();S.tab=t.dataset.tab;render();return}
  const a=t.dataset.act;
  if(a==='root')return linkRoot();
  if(a==='grant')return grantRoot();
  if(a==='starteach')return startEach();
  if(a==='pickeach')return pickEach(t.dataset.k);
  if(a==='granteach')return grantEach();
  if(a==='recheck'){S.check=null;render();return}
  if(a==='setpw'){const p1=$('#pw1').value,p2=$('#pw2').value;if(p1.length<4){toast('密碼至少 4 碼',true);return}if(p1!==p2){toast('兩次輸入不同',true);return}
    S.set.adminHash=await sha(p1);S.unlocked=true;S.dirty=true;render();toast('記得按「儲存共用設定」才會生效');return}
  if(a==='unlock'){if(await sha($('#pw1').value)===S.set.adminHash){S.unlocked=true;render()}else toast('密碼錯誤',true);return}
  if(a==='lock'){readForm();S.unlocked=false;render();return}
  if(a==='reload'){if(S.dirty&&!confirm('放棄尚未儲存的修改？'))return;S.dirty=false;await loadAll();return}
  if(a==='save')return saveSet();
  if(a==='genpat'){readForm();const k=t.dataset.k;const f=S.set.formats[k];if(!f.example){toast('先填範例',true);return}f.pattern=exampleToPattern(f.example);S.dirty=true;render();return}
  if(a==='famadd'){readForm();const o=familySources().find(x=>x.src===t.dataset.src);if(o){o.list.forEach(x=>{if(!S.set.families.includes(x))S.set.families.push(x)});S.dirty=true;render()}return}
  if(a==='chpw'){const p1=$('#npw1').value,p2=$('#npw2').value;if(p1.length<4){toast('密碼至少 4 碼',true);return}if(p1!==p2){toast('兩次輸入不同',true);return}
    readForm();S.set.adminHash=await sha(p1);S.dirty=true;render();toast('按「儲存共用設定」後生效');return}
});
document.addEventListener('input',e=>{
  if(e.target.dataset.try){const k=e.target.dataset.try;readForm();const r=testPat(S.set.formats[k].pattern,e.target.value);const el=$('#try-'+k);
    el.innerHTML=!e.target.value?'':r===null?'未設定規則':r===undefined?'<span class="badc">規則寫法有誤</span>':r?'<span class="okc">✔ 符合</span>':'<span class="badc">✖ 不符合</span>';return}
  if(e.target.closest('#main')&&S.tab==='settings'){S.dirty=true;const d=$('#dirty');if(d)d.textContent='　● 有未儲存的修改'}
});
document.addEventListener('change',e=>{if(e.target.dataset.folder){S.dirty=true;const d=$('#dirty');if(d)d.textContent='　● 有未儲存的修改'}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='pw1'||e.target.id==='pw2')){const b=document.querySelector('[data-act=unlock],[data-act=setpw]');if(b)b.click()}});
window.addEventListener('beforeunload',e=>{if(S.dirty&&S.unlocked){e.preventDefault();e.returnValue=''}});
window.addEventListener('focus',()=>{if(ready()&&!S.needGrant.length&&!S.loading&&S.tab==='home'&&Date.now()-(S.loadedAt||0)>60000)loadAll()});

render();restoreRoot();
</script>
</body>
